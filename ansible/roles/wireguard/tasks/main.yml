---
- name: Install WireGuard packages
  apt:
    name:
      - wireguard
      - wireguard-tools
      - resolvconf
    state: present
    update_cache: yes

- name: Ensure WireGuard configuration directory exists
  file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy WireGuard configuration
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - restart wireguard

- name: Ensure WireGuard service is enabled and started
  systemd:
    name: wg-quick@wg0
    state: started
    enabled: yes
