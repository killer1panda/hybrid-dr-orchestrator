global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: 'dr-webhook-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'dr-webhook-receiver'
      continue: false

receivers:
  - name: 'dr-webhook-receiver'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/dr-alert'
        send_resolved: true
        http_config:
          follow_redirects: true
