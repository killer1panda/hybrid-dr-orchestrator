# infra/onprem/docker-compose.yml
# Simulated on-prem site. Secrets come from infra/onprem/.env (gitignored); see .env.example.
# Only onprem-db receives the AWS backup-writer credentials; the app tier never sees them.
networks:
  dr_onprem_bridge:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
volumes:
  pg_data:
services:
  onprem-db:
    build:
      context: ./db
    image: hybrid-dr/onprem-db:16
    container_name: onprem-db
    env_file: .env
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='/usr/local/bin/archive_wal.sh %p %f'
      -c archive_timeout=60s
      -c max_wal_senders=3
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      dr_onprem_bridge:
        ipv4_address: 192.168.10.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  onprem-app:
    build:
      context: ../..
      dockerfile: app/Dockerfile
    container_name: onprem-app
    environment:
      POSTGRES_HOST: 192.168.10.30
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/onprem/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/onprem/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/onprem/.env}
      NODE_NAME: onprem-app-1
    depends_on:
      onprem-db:
        condition: service_healthy
    networks:
      dr_onprem_bridge:
        ipv4_address: 192.168.10.20
    restart: unless-stopped
  onprem-probe:
    build:
      context: ../..
      dockerfile: app/Dockerfile
    container_name: onprem-probe
    command: ["python", "-m", "app.rpo_probe"]
    environment:
      POSTGRES_HOST: 192.168.10.30
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/onprem/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/onprem/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/onprem/.env}
      NODE_NAME: onprem-db-primary
    depends_on:
      onprem-db:
        condition: service_healthy
    networks:
      dr_onprem_bridge:
        ipv4_address: 192.168.10.25
    restart: unless-stopped
  onprem-web:
    image: nginx:1.25-alpine
    container_name: onprem-web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - onprem-app
    networks:
      dr_onprem_bridge:
        ipv4_address: 192.168.10.10
    restart: unless-stopped
