name: CI Quality Gate & Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality-gate:
    name: Python Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Ruff Format Check
        run: ruff format --check src tests

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Mypy Strict Type Analysis
        run: mypy --strict src tests

      - name: Run Unit Test Suite
        run: pytest -v tests --cov=hybrid_dr --cov-report=term-missing

  terraform-quality-gate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Persistent Infrastructure Module
        run: |
          cd infra/aws/persistent
          terraform init -backend=false
          terraform validate

      - name: Validate Ephemeral DR Replica Module
        run: |
          cd infra/aws/envs/dr
          terraform init -backend=false
          terraform validate

  ansible-quality-gate:
    name: Ansible Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Ansible Core & Collections
        run: |
          pip install ansible-core
          ansible-galaxy collection install community.docker community.general

      - name: Check Playbook Syntaxes
        run: |
          cd ansible
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/restore_db.yml --syntax-check
          ansible-playbook playbooks/smoke_tests.yml --syntax-check
          ansible-playbook playbooks/failback.yml --syntax-check

  security-quality-gate:
    name: Security Scans (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code (Full History)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@eed5d40902c2e0b5196f7c503beaa1c3b5d27878 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy IaC & Configuration Security Scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "config"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "0" # Non-blocking on informational rules; logged to PR summary
