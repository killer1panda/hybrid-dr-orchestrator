version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/orchestrator"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain Docker Compose dependencies
  - package-ecosystem: "docker"
    directory: "/infra/monitoring"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
